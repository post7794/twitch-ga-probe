name: warp-ipv6

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "WARP endpoint ip:port"
        required: false
        default: "162.159.192.1:2408"

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/twitch-reg-test
          token: ${{ secrets.TWITCH_PAT }}
          path: src

      - name: WARP start + probe (single step, process must live)
        shell: pwsh
        run: |
          $exe  = "$env:GITHUB_WORKSPACE\src\tools\runner\runner.exe"
          $rd   = "D:\warp-data"
          $ep   = "${{ inputs.endpoint }}"
          New-Item -ItemType Directory -Force -Path $rd | Out-Null
          & $exe generate --data-dir $rd 2>&1 | Out-String

          $common = @("run","--data-dir",$rd,"--http-addr","127.0.0.1:8118","--socks-addr","127.0.0.1:1080","--dns","1.1.1.1")
          $tries = @(@("--endpoint",$ep), @("--endpoint","162.159.193.1:2408"), @("--scan","--4","--scan-rtt","1000ms"))
          $ready = $false
          foreach ($a in $tries) {
            Write-Host "=== attempt: $($a -join ' ') ==="
            Remove-Item D:\warp.out.log,D:\warp.err.log -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $exe -ArgumentList ($common + $a) -RedirectStandardOutput "D:\warp.out.log" -RedirectStandardError "D:\warp.err.log" -PassThru
            $lim = if ($a[0] -eq "--scan") { 40 } else { 15 }
            for ($i=0; $i -lt $lim; $i++) {
              Start-Sleep 4
              $t = curl.exe -s --max-time 8 -x http://127.0.0.1:8118 https://cloudflare.com/cdn-cgi/trace 2>$null
              if ($t -match "warp=on") { Write-Host "WARP READY (iter $i): $($a -join ' ')"; $t | Out-String; $ready = $true; break }
            }
            if ($ready) { break }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          if (-not $ready) { Write-Host "WARP NOT READY"; exit 0 }

          Write-Host "########## HTTP proxy egress by target family ##########"
          Write-Host "--- CF trace (domain, Cloudflare) ---"
          curl.exe -s --max-time 20 -x http://127.0.0.1:8118 https://cloudflare.com/cdn-cgi/trace
          Write-Host "--- api.ipify.org (IPv4-only record) ---"
          curl.exe -s --max-time 20 -x http://127.0.0.1:8118 https://api.ipify.org; Write-Host ""
          Write-Host "--- api6.ipify.org (IPv6-only record) ---"
          curl.exe -s --max-time 20 -x http://127.0.0.1:8118 https://api6.ipify.org; Write-Host ""
          Write-Host "--- explicit IPv6 literal CF trace ---"
          curl.exe -s --max-time 20 -x http://127.0.0.1:8118 "https://[2606:4700:4700::1111]/cdn-cgi/trace"; Write-Host ""
          Write-Host "--- explicit IPv4 literal CF trace ---"
          curl.exe -s --max-time 20 -x http://127.0.0.1:8118 "https://1.1.1.1/cdn-cgi/trace"; Write-Host ""

          Write-Host "########## Twitch via WARP ##########"
          Write-Host "--- www.twitch.tv ---"
          curl.exe -s -o NUL --max-time 25 -x http://127.0.0.1:8118 -w "www.twitch.tv HTTP %{http_code}`n" https://www.twitch.tv/
          Write-Host "--- gql.twitch.tv/integrity ---"
          curl.exe -s --max-time 25 -x http://127.0.0.1:8118 -X POST https://gql.twitch.tv/integrity -H "Client-ID: kimne78kx3ncx6brgo4mv6wki5h1ko" -H "X-Device-Id: probe-dev-1" -H "Origin: https://www.twitch.tv" -w "`nHTTP %{http_code}`n"
          Write-Host "--- passport.twitch.tv/protected_register (step1, no signing) ---"
          $body = '{"username":"probeabc123xy","password":"Aa1!probe9x8y7z6w","email":"probeabc123xy@example.com","birthday":{"day":15,"month":6,"year":1995,"isOver18":true},"email_verification_enabled":false,"client_id":"kimne78kx3ncx6brgo4mv6wki5h1ko","is_password_guide":"nist"}'
          curl.exe -s --max-time 25 -x http://127.0.0.1:8118 -X POST https://passport.twitch.tv/protected_register -H "Content-Type: text/plain;charset=UTF-8" -H "Origin: https://www.twitch.tv" --data $body -w "`nHTTP %{http_code}`n"

          Write-Host "########## DoH AAAA (final addresses) ##########"
          foreach ($d in @("h2.twitch.map.fastly.net","passport.twitch.tv","gql.twitch.tv","client-integrity.twitch.tv","k.twitch.tv","kadara.tv","kasada.io")) {
            $r = curl.exe -s --max-time 12 "https://cloudflare-dns.com/dns-query?name=$d&type=AAAA" -H "accept: application/dns-json"
            Write-Host "$d : $r"
          }

          Write-Host "########## WARP logs ##########"
          Get-Content D:\warp.out.log -Tail 30 -ErrorAction SilentlyContinue | Out-String
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
