name: runpy

on:
  workflow_dispatch:
    inputs:
      headless:
        description: "NO_HEADLESS: true=headful, false=headless"
        required: false
        default: "false"

jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/twitch-reg-test
          token: ${{ secrets.TWITCH_PAT }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + CloakBrowser
        shell: pwsh
        run: |
          python -m pip install -r src/requirements.txt --quiet
          python -m cloakbrowser install 2>&1 | Out-String

      - name: Show chrome exe
        shell: pwsh
        run: |
          Get-ChildItem "$env:USERPROFILE\.cloakbrowser" -ErrorAction SilentlyContinue | Out-String

      - name: Run run.py (1 worker x 1 account)
        shell: pwsh
        env:
          WORKER_COUNT: "1"
          ACCOUNTS_PER_WORKER: "1"
          VPNGATE_ENABLED: "false"
          WARP_RESET_ENABLED: "false"
          WARP_DIRECT_FALLBACK: "false"
          FOLLOW_ENABLED: "false"
          CHECK_ONLY: "false"
          GEO_MATCH: "true"
          NO_HEADLESS: ${{ inputs.headless }}
          FP_SPOOF: "minimal"
          LOGURU_LEVEL: "DEBUG"
          PYTHONIOENCODING: "utf-8"
        run: |
          cd src
          python run.py 2>&1 | Out-String

      - name: Dump logs
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== logs/browser_*.log ==="
          Get-Content src\logs\browser_*.log -Tail 200 -ErrorAction SilentlyContinue | Out-String
