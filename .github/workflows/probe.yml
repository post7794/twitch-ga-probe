name: net-probe

on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-form note"
        required: false
        default: "twitch/kasada ipv4 vs ipv6"

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Interfaces, routes, egress
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "===== ipconfig ====="
          ipconfig | Out-String
          Write-Host "===== IPv6 global addresses ====="
          Get-NetIPAddress -AddressFamily IPv6 | Format-Table -AutoSize | Out-String
          Write-Host "===== IPv6 default route ====="
          Get-NetRoute -DestinationPrefix '::/0' -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String
          Write-Host "===== IPv4 egress (api.ipify.org) ====="
          curl.exe -4 -s --max-time 15 https://api.ipify.org; Write-Host ""
          Write-Host "===== IPv6 egress (api6.ipify.org) ====="
          curl.exe -6 -s --max-time 15 https://api6.ipify.org; Write-Host ""
          Write-Host "===== CF trace v4 ====="
          curl.exe -4 -s --max-time 15 https://cloudflare.com/cdn-cgi/trace
          Write-Host "===== CF trace v6 ====="
          curl.exe -6 -s --max-time 15 https://cloudflare.com/cdn-cgi/trace

      - name: IPv6 transition tech + DNS64
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "===== teredo state ====="
          netsh interface teredo show state | Out-String
          Write-Host "===== ipv6 interfaces ====="
          netsh interface ipv6 show interface | Out-String
          Write-Host "===== DNS64/NAT64 detect (ipv4only.arpa AAAA) ====="
          Resolve-DnsName -Type AAAA ipv4only.arpa -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String
          Write-Host "===== egress IPv6 via DNS64 host ====="
          curl.exe -6 -s --max-time 12 https://ipv6.google.com/ -o NUL -w "ipv6.google.com HTTP %{http_code} %{time_total}s`n"

      - name: Python family-split probe
        shell: pwsh
        run: python probe.py

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out.json
          if-no-files-found: ignore
