name: kasada-grab

on:
  workflow_dispatch:

jobs:
  grab:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install playwright
        shell: pwsh
        run: pip install playwright --quiet
      - name: Grab signup traffic
        shell: pwsh
        continue-on-error: true
        run: python grab.py
      - name: Chrome version
        shell: pwsh
        continue-on-error: true
        run: |
          $paths = @("C:\Program Files\Google\Chrome\Application\chrome.exe","C:\Program Files (x86)\Google\Chrome\Application\chrome.exe")
          foreach ($p in $paths) { if (Test-Path $p) { & $p --version } }
